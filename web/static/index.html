<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>揭棋 Web UI</title>
<style>
:root{
  --bg:#17201b;
  --panel:#f7efd9;
  --panel-2:#fff8e8;
  --ink:#1f271f;
  --muted:#657060;
  --line:#d8c397;
  --board:#d9a857;
  --board-dark:#9a6332;
  --red:#b3261e;
  --red-piece:#fff0df;
  --red-piece-edge:#c94734;
  --red-hidden:#9f342d;
  --red-hidden-edge:#f0b08f;
  --black:#273043;
  --black-piece:#e9eef3;
  --black-piece-edge:#344055;
  --black-hidden:#283244;
  --black-hidden-edge:#9eb0c7;
  --green:#2f7d55;
  --blue:#285a84;
  --gold:#e1b143;
  --shadow:0 18px 50px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,255,.04) 1px,transparent 1px),
    var(--bg);
  background-size:44px 44px;
}
button,select{font:inherit}
.app{max-width:1220px;margin:0 auto;padding:22px}
.topbar{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-end;
  color:#f9f1df;
  margin-bottom:16px;
}
h1{font-size:28px;line-height:1.1;margin:0 0 6px;letter-spacing:0}
.subtitle{margin:0;color:#d7ccb4;font-size:14px}
.status-pill{
  min-width:190px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  border-radius:8px;
  color:#fff6d9;
  text-align:right;
  font-size:14px;
}
.workspace{display:grid;grid-template-columns:minmax(500px,1fr) 360px;gap:18px;align-items:start}
.board-panel,.side-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
}
.board-panel{padding:16px;overflow:auto}
.side-panel{padding:14px;display:grid;gap:14px}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}
.tool-group{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px;
  border:1px solid #e5d2a9;
  background:rgba(255,255,255,.38);
  border-radius:8px;
}
.tool-label{font-size:12px;color:var(--muted);font-weight:700}
button,select{
  min-height:36px;
  border-radius:6px;
  border:1px solid #bfa875;
  background:#fff8e8;
  color:var(--ink);
  padding:0 10px;
  cursor:pointer;
}
button:hover,select:hover{border-color:#8f7441;background:#fffdf4}
button.primary{background:var(--green);border-color:var(--green);color:white;font-weight:700}
button.primary.stop{background:#9f2e27;border-color:#9f2e27}
button.icon{min-width:38px;padding:0 9px}
.board-wrap{display:flex;justify-content:center}
.board{
  --step:54px;
  --river:0px;
  --pad-x:30px;
  --pad-y:30px;
  position:relative;
  width:calc(var(--pad-x) * 2 + var(--step) * 8);
  height:calc(var(--pad-y) * 2 + var(--step) * 9 + var(--river));
  background:var(--board);
  border:4px solid var(--board-dark);
  border-radius:8px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 24px rgba(67,38,12,.18);
  overflow:hidden;
}
.board-lines{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
.cell{
  width:42px;
  height:42px;
  transform:translate(-50%,-50%);
  background:rgba(237,196,119,.52);
  border:1px solid rgba(96,57,24,.22);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
  font-weight:800;
  line-height:1;
  position:absolute;
  z-index:1;
  transition:box-shadow .08s ease,background .08s ease;
}
.cell:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.cell.red_open,.cell.black_open,.cell.red_hidden,.cell.black_hidden{
  border-radius:50%;
  width:46px;
  height:46px;
  border:2px solid rgba(255,248,228,.9);
  box-shadow:0 3px 0 rgba(77,42,16,.38),0 7px 12px rgba(77,42,16,.2),inset 0 0 0 2px rgba(255,255,255,.35);
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.cell.red_open{
  color:var(--red);
  background:radial-gradient(circle at 35% 28%,#fffaf0 0 26%,var(--red-piece) 58%,#f1c8a9 100%);
  border-color:var(--red-piece-edge);
}
.cell.black_open{
  color:var(--black);
  background:radial-gradient(circle at 35% 28%,#ffffff 0 24%,var(--black-piece) 58%,#bfc9d4 100%);
  border-color:var(--black-piece-edge);
}
.cell.red_hidden,.cell.black_hidden{
  color:transparent;
  text-shadow:none;
}
.cell.red_hidden{
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 3px,transparent 3px 8px),
    radial-gradient(circle at 36% 28%,#c95447 0 18%,var(--red-hidden) 62%,#67231f 100%);
  border-color:var(--red-hidden-edge);
}
.cell.black_hidden{
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 3px,transparent 3px 8px),
    radial-gradient(circle at 36% 28%,#4f5e78 0 18%,var(--black-hidden) 62%,#141923 100%);
  border-color:var(--black-hidden-edge);
}
.cell.red_hidden::before,.cell.black_hidden::before{
  content:"";
  position:absolute;
  inset:9px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.42);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);
}
.cell.empty{color:transparent;font-weight:500;background:transparent;border-color:transparent}
.cell.empty:hover{background:rgba(255,255,255,.16);border-color:rgba(96,57,24,.25)}
.cell.selected{box-shadow:0 0 0 3px var(--gold),0 0 20px rgba(225,177,67,.65)}
.cell.dest::after{
  content:"";
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(47,125,85,.18);
  position:absolute;
}
.cell.red_open.dest::after,.cell.black_open.dest::after,.cell.red_hidden.dest::after,.cell.black_hidden.dest::after{
  inset:auto 2px 2px auto;
}
.panel-section{
  background:var(--panel-2);
  border:1px solid #e5d2a9;
  border-radius:8px;
  padding:12px;
}
.section-title{margin:0 0 10px;font-size:15px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{padding:10px;border:1px solid #eadab9;border-radius:6px;background:white}
.metric b{display:block;font-size:20px;margin-bottom:2px}
.metric span{font-size:12px;color:var(--muted)}
#captured{min-height:28px;line-height:1.8;font-size:16px}
.captured-piece{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;margin:0 3px 4px 0;background:#f2dec0;border:1px solid #caa873;font-weight:800}
.captured-piece.red{color:var(--red)}.captured-piece.black{color:var(--black)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.recs table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden;border:1px solid #e5d2a9;border-radius:6px}
.recs th,.recs td{padding:8px 7px;border-bottom:1px solid #eadab9;text-align:right;vertical-align:top}
.recs th{background:#ead8b2;color:#433819;font-size:12px;white-space:nowrap}
.recs tr:last-child td{border-bottom:0}
.recs td:nth-child(2),.recs th:nth-child(2),.recs td:last-child,.recs th:last-child{text-align:left}
.empty-state{padding:18px;border:1px dashed #cdb27a;border-radius:8px;color:var(--muted);text-align:center;background:#fffdf4}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr}
  .side-panel{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .app{padding:14px}
  .topbar{display:block}
  .status-pill{text-align:left;margin-top:12px}
  .toolbar,.tool-group{align-items:stretch}
  .tool-group{width:100%;flex-wrap:wrap}
  .side-panel{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>揭棋规则验证台</h1>
      <p class="subtitle">编辑局面、查看合法走法、用推荐结果辅助核对规则。</p>
    </div>
    <div class="status-pill" id="status">查看模式</div>
  </header>

  <section class="workspace">
    <div class="board-panel">
      <div class="toolbar">
        <div class="tool-group">
          <button class="icon" onclick="resetBoard()" title="重置棋盘">重置</button>
          <button id="playBtn" class="primary" onclick="togglePlayMode()">人机对弈</button>
          <button onclick="importFEN()">导入 FEN</button>
        </div>
        <div class="tool-group">
          <span class="tool-label">分析</span>
          <select id="agent" title="推荐算法">
            <option>musesfish</option>
            <option>ismcts</option>
            <option>greedy</option>
            <option>belief_mcts</option>
          </select>
          <button onclick="analyze()">分析</button>
        </div>
        <div class="tool-group">
          <span class="tool-label">编辑</span>
          <select id="editMode" title="编辑模式">
            <option value="">查看</option>
            <option value="empty">清空</option>
            <option value="red_open">红明子</option>
            <option value="black_open">黑明子</option>
            <option value="red_hidden">红暗子</option>
            <option value="black_hidden">黑暗子</option>
          </select>
          <select id="pieceType" title="棋子类型">
            <option value=0>帅/将</option>
            <option value=1>仕/士</option>
            <option value=2>相/象</option>
            <option value=3>馬/马</option>
            <option value=4>車/车</option>
            <option value=5>炮</option>
            <option value=6>兵/卒</option>
          </select>
        </div>
      </div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
    </div>

    <aside class="side-panel">
      <section class="panel-section">
        <h2 class="section-title">规则反馈</h2>
        <div class="metrics">
          <div class="metric"><b id="legalCount">-</b><span>当前合法走法</span></div>
          <div class="metric"><b id="selectedInfo">-</b><span>选中位置</span></div>
          <div class="metric"><b id="pieceCount">-</b><span>盘面棋子</span></div>
          <div class="metric"><b id="capturedCount">0</b><span>已吃棋子</span></div>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">已吃棋子</h2>
        <div id="captured">-</div>
      </section>

      <section class="panel-section recs">
        <h2 class="section-title">AI 推荐</h2>
        <div id="recs" class="empty-state">点击“分析”查看推荐走法</div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">操作提示</h2>
        <p class="hint" id="hint">查看模式下点击棋子不会改盘。切到编辑模式可摆局面；切到人机对弈后，点击棋子会高亮所有合法落点。</p>
      </section>
    </aside>
  </section>
</main>

<script>
let playMode = false, selectedPos = null, legalCache = [];

const CN = {0:'帅',1:'仕',2:'相',3:'馬',4:'車',5:'炮',6:'兵'};
const CNB = {0:'将',1:'士',2:'象',3:'马',4:'车',5:'炮',6:'卒'};
const BOARD_GEOMETRY = {step:54, river:0, padX:30, padY:30};

function boardPoint(row, col) {
  return {
    x: BOARD_GEOMETRY.padX + col * BOARD_GEOMETRY.step,
    y: BOARD_GEOMETRY.padY + row * BOARD_GEOMETRY.step + (row >= 5 ? BOARD_GEOMETRY.river : 0),
  };
}

function addSvgLine(svg, x1, y1, x2, y2, width = 1.5) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.setAttribute('stroke', 'rgba(83,48,20,.72)');
  line.setAttribute('stroke-width', width);
  line.setAttribute('stroke-linecap', 'square');
  svg.appendChild(line);
}

function addRiverText(svg, text, x, y) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  node.textContent = text;
  node.setAttribute('x', x);
  node.setAttribute('y', y);
  node.setAttribute('text-anchor', 'middle');
  node.setAttribute('dominant-baseline', 'middle');
  node.setAttribute('font-size', '22');
  node.setAttribute('font-weight', '800');
  node.setAttribute('letter-spacing', '8');
  node.setAttribute('fill', 'rgba(83,48,20,.74)');
  svg.appendChild(node);
}

function drawBoardLines(board) {
  const width = BOARD_GEOMETRY.padX * 2 + BOARD_GEOMETRY.step * 8;
  const height = BOARD_GEOMETRY.padY * 2 + BOARD_GEOMETRY.step * 9 + BOARD_GEOMETRY.river;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('board-lines');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const left = boardPoint(0, 0).x;
  const right = boardPoint(0, 8).x;
  const top = boardPoint(0, 0).y;
  const upperRiver = boardPoint(4, 0).y;
  const lowerRiver = boardPoint(5, 0).y;
  const bottom = boardPoint(9, 0).y;

  for (let c = 0; c < 9; c++) {
    const x = boardPoint(0, c).x;
    addSvgLine(svg, x, top, x, upperRiver);
    addSvgLine(svg, x, lowerRiver, x, bottom);
  }
  for (let r = 0; r < 10; r++) {
    const y = boardPoint(r, 0).y;
    addSvgLine(svg, left, y, right, y);
  }
  addSvgLine(svg, left, top, right, top, 2.4);
  addSvgLine(svg, left, bottom, right, bottom, 2.4);
  addSvgLine(svg, left, top, left, bottom, 2.4);
  addSvgLine(svg, right, top, right, bottom, 2.4);
  addSvgLine(svg, boardPoint(0, 3).x, boardPoint(0, 3).y, boardPoint(2, 5).x, boardPoint(2, 5).y);
  addSvgLine(svg, boardPoint(0, 5).x, boardPoint(0, 5).y, boardPoint(2, 3).x, boardPoint(2, 3).y);
  addSvgLine(svg, boardPoint(7, 3).x, boardPoint(7, 3).y, boardPoint(9, 5).x, boardPoint(9, 5).y);
  addSvgLine(svg, boardPoint(7, 5).x, boardPoint(7, 5).y, boardPoint(9, 3).x, boardPoint(9, 3).y);

  const riverY = (upperRiver + lowerRiver) / 2;
  addRiverText(svg, '楚河', boardPoint(4, 2).x, riverY);
  addRiverText(svg, '汉界', boardPoint(4, 6).x, riverY);
  board.appendChild(svg);
}

function initBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  drawBoardLines(b);
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.textContent = '';
      cell.dataset.row = r; cell.dataset.col = c;
      const point = boardPoint(r, c);
      cell.style.left = `${point.x}px`;
      cell.style.top = `${point.y}px`;
      cell.onclick = () => cellClick(r, c, cell);
      b.appendChild(cell);
    }
  }
}

function togglePlayMode() {
  playMode = !playMode;
  const btn = document.getElementById('playBtn');
  if (playMode) {
    btn.classList.add('stop'); btn.textContent = '停止对弈';
    document.getElementById('editMode').value = '';
    setStatus('你的回合：请选择棋子');
  } else {
    btn.classList.remove('stop'); btn.textContent = '人机对弈';
    setStatus('查看模式');
    selectedPos = null;
    clearHighlights();
  }
  refreshLegalMoves();
}

function clearHighlights() {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected','dest'));
  document.getElementById('selectedInfo').textContent = '-';
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function setHint(text) {
  document.getElementById('hint').textContent = text;
}

function formatCoord(row, col) {
  return `${col + 1}路${row + 1}线`;
}

function describeCell(cell) {
  if (cell.classList.contains('red_hidden')) return '红方暗子';
  if (cell.classList.contains('black_hidden')) return '黑方暗子';
  if (cell.classList.contains('empty')) return '空';
  return cell.textContent || '棋子';
}

async function refreshLegalMoves() {
  try {
    const resp = await fetch('/api/legal_moves');
    const data = await resp.json();
    legalCache = data.legal_moves || [];
    document.getElementById('legalCount').textContent = legalCache.length;
  } catch(e) {
    document.getElementById('legalCount').textContent = '!';
  }
}

function updateCounts() {
  const pieces = [...document.querySelectorAll('.cell')].filter(c => !c.classList.contains('empty')).length;
  document.getElementById('pieceCount').textContent = pieces;
}

async function cellClick(r, c, cell) {
  if (playMode) {
    const pos = r * 9 + c;
    if (!legalCache.length) await refreshLegalMoves();
    const legal = legalCache;

    if (selectedPos === null) {
      const hasPiece = legal.some(m => m.from[0]===r && m.from[1]===c);
      if (!hasPiece) {
        setHint(`${formatCoord(r, c)} 没有当前可走的合法走法。`);
        return;
      }
      selectedPos = pos;
      document.getElementById('selectedInfo').textContent = formatCoord(r, c);
      cell.classList.add('selected');
      const moves = legal.filter(m => m.from[0]===r && m.from[1]===c);
      moves.forEach(m => {
        const d = document.querySelector(`.cell[data-row="${m.to[0]}"][data-col="${m.to[1]}"]`);
        if (d) d.classList.add('dest');
      });
      setHint(`已选 ${formatCoord(r, c)}，共有 ${moves.length} 个合法落点。`);
    } else {
      const move = legal.find(m => m.from[0]*9+m.from[1]===selectedPos && m.to[0]*9+m.to[1]===pos);
      if (move) {
        await playHumanThenAi(move.action);
      } else {
        setHint(`${formatCoord(r, c)} 不是当前选中棋子的合法落点。`);
      }
      selectedPos = null;
      clearHighlights();
    }
    return;
  }

  // Edit mode
  const mode = document.getElementById('editMode').value;
  if (!mode) {
    setHint(`查看位置 ${formatCoord(r, c)}：${describeCell(cell)}。`);
    return;
  }
  const pt = parseInt(document.getElementById('pieceType').value);
  cell.className = 'cell ' + mode;
  cell.dataset.ptype = pt;
  if (mode.includes('red')) cell.textContent = mode.includes('hidden') ? '' : CN[pt];
  else if (mode.includes('black')) cell.textContent = mode.includes('hidden') ? '' : CNB[pt];
  if (mode === 'empty') { cell.className = 'cell empty'; cell.textContent = ''; }
  updateBoardState();
  updateCounts();
  setHint(`已编辑 ${formatCoord(r, c)}，后台局面已同步。`);
}

async function postJson(url, body) {
  const resp = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})
  });
  const data = await resp.json();
  if (!resp.ok) {
    throw new Error(data.detail || `请求失败：${resp.status}`);
  }
  return data;
}

async function playHumanThenAi(action) {
  try {
    const humanBoard = await postJson('/api/apply_move', {action});
    renderBoard(humanBoard.cells, humanBoard.captured);
    clearHighlights();
    await refreshLegalMoves();
    await refreshRecs();
    setStatus('AI 思考中...');
    setHint(`已执行走法 action=${action}。`);

    const analyzed = await postJson('/api/analyze', {
      agent: document.getElementById('agent').value,
      top_k: 1
    });
    const aiMove = analyzed.recommendations?.[0];
    if (!aiMove) {
      setStatus('对局结束');
      setHint('AI 没有可走的合法走法。');
      return;
    }

    const aiBoard = await postJson('/api/apply_move', {action: aiMove.action});
    renderBoard(aiBoard.cells, aiBoard.captured);
    await refreshLegalMoves();
    await refreshRecs();
    setStatus('你的回合');
    setHint(`AI 已走 ${aiMove.move}。`);
  } catch (e) {
    setStatus('出错');
    setHint(e.message || 'AI 对弈流程出错。');
    await refreshLegalMoves();
    await refreshRecs();
  }
}

function updateBoardState() {
  // Build board state from current cell display for manual editing
  const cells = [];
  document.querySelectorAll('.cell').forEach(c => {
    const r = parseInt(c.dataset.row), col = parseInt(c.dataset.col);
    const cls = c.className.replace('cell ','').replace(' selected','').replace(' dest','').trim();
    cells.push({row:r, col:col, state: cls==='empty'?'empty':cls, piece_type: parseInt(c.dataset.ptype||0)});
  });
  fetch('/api/load_state', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({cells, current_player: 0})
  }).then(() => refreshLegalMoves()).catch(()=>{});
}

function renderBoard(cells, captured) {
  document.querySelectorAll('.cell').forEach(c => {
    const r = parseInt(c.dataset.row), col = parseInt(c.dataset.col);
    const info = cells.find(x => x.row===r && x.col===col);
    if (info) {
      c.className = 'cell ' + info.state;
      c.dataset.ptype = info.piece_type;
      c.textContent = info.state.includes('hidden') ? '' : (info.label || '·');
    } else {
      c.className = 'cell empty'; c.textContent = ''; c.dataset.ptype = '';
    }
  });
  if (captured) {
    document.getElementById('captured').innerHTML = captured.map(c => `<span class="captured-piece ${c.color===0?'red':'black'}">${c.label}</span>`).join('') || '-';
    document.getElementById('capturedCount').textContent = captured.length;
  }
  updateCounts();
}

async function resetBoard() {
  const r = await fetch('/api/reset', {method:'POST'});
  const d = await r.json();
  renderBoard(d.cells, d.captured);
  clearHighlights();
  await refreshLegalMoves();
  setStatus(playMode ? '你的回合' : '查看模式');
  setHint('棋盘已重置。');
}

async function analyze() {
  setStatus('分析中...');
  const r = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent: document.getElementById('agent').value, top_k:5})});
  const d = await r.json();
  showRecs(d.recommendations);
  setStatus(playMode ? '你的回合' : '查看模式');
}

async function refreshRecs() {
  try {
    const r = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent: document.getElementById('agent').value, top_k:5})});
    const d = await r.json();
    showRecs(d.recommendations);
  } catch(e) {}
}

function showRecs(recs) {
  if (!recs || recs.length === 0) {
    document.getElementById('recs').innerHTML = '<div class="empty-state">当前没有可推荐走法</div>';
    return;
  }
  let html = '<table><tr><th>#</th><th>走法</th><th>评分</th><th>均值</th><th>P10</th><th>不确定</th><th>原因</th></tr>';
  recs.forEach((r,i) => {
    html += `<tr><td>${i+1}</td><td>${r.move}</td><td>${r.score.toFixed(0)}</td><td>${r.mean_score.toFixed(0)}</td><td>${r.p10_score.toFixed(0)}</td><td>${r.uncertainty.toFixed(0)}</td><td>${(r.reasons||[]).join(', ')||'-'}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('recs').innerHTML = html;
}

async function importFEN() {
  const fen = prompt('JieqiFEN:');
  if (!fen) return;
  await fetch('/api/load_fen', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fen})});
  const r = await fetch('/api/board_state');
  const d = await r.json();
  renderBoard(d.cells, d.captured);
  await refreshLegalMoves();
  setHint('FEN 已导入。');
}

initBoard();
resetBoard();
</script>
